name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev
      # Vite pulls picomatch 4.0.7 into the dev-only toolchain. GHSA-fc5q-39xc-vjpf
      # has no patched npm release yet; report it while still blocking critical findings.
      # Restore npm's default high-severity threshold after an upstream patch is released.
      - name: Audit full dependency tree (critical findings block)
        run: npm audit --audit-level=critical

  e2e-mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
